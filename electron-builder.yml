appId: com.eeg.edfreader
productName: EEG EDF Reader
copyright: Copyright © 2024 EEG EDF Reader

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
  - "!src/**/*"
  - "!pages/**/*"
  - "!lib/**/*"
  - "!styles/**/*"

# ── Windows ──────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: public/icon.png
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: EEG EDF Reader
  installerIcon: public/icon.png
  uninstallerIcon: public/icon.png
  installerHeaderIcon: public/icon.png
  deleteAppDataOnUninstall: false

# ── Linux ─────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: public/icon.png
  category: Science

# ── macOS ─────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: public/icon.png
  category: public.app-category.medical
